[workspace]
members = ["crates/oxcdf", "crates/oxcdf-hdf5"]
# `cargo fuzz` builds its own crate against a nightly toolchain and its own
# profile, so it must stay outside the workspace.
exclude = ["fuzz"]
resolver = "2"

# Both crates ship together and share a version. `oxcdf` depends on the exact
# `oxcdf-hdf5` beside it, so the two never drift.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
repository = "https://github.com/robinskil/oxcdf"
license = "Apache-2.0"

[workspace.dependencies]
oxcdf-hdf5 = { path = "crates/oxcdf-hdf5", version = "0.1.0" }

thiserror = "2.0.12"
# Pure-Rust inflate. Never turn on the C zlib backends.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
zstd = "0.13.2"
lz4_flex = "0.11"
# A concurrent cache. A hit takes no lock.
moka = { version = "0.12.10", features = ["sync"] }
# Byte buffers that clone and slice without a copy.
bytes = "1.10.0"

ndarray = "0.17.1"
object_store = "0.13.1"
tokio = { version = "1.47.1", features = ["rt", "sync"] }
async-trait = "0.1.88"

[workspace.dependencies.netcdf]
git = "https://github.com/robinskil/netcdf.git"
version = "0.11.1"
features = ["ndarray"]

[profile.release]
lto = "thin"
codegen-units = 1
