# The Rust standard style, stated rather than assumed.
#
# Every value here is already a rustfmt default. Writing them down pins the
# format: a later toolchain that changes a default cannot silently reformat the
# whole tree. Add no option that needs nightly. The toolchain is stable, and an
# unstable option only prints a warning and does nothing.

# `cargo fmt` reads the edition from the manifest. A bare `rustfmt` call, or an
# editor that runs one, does not. This makes both agree.
edition = "2021"

max_width = 100
tab_spaces = 4
hard_tabs = false

# The tests run on Windows. Fix the line ending so the check gives the same
# answer on every platform.
newline_style = "Unix"

reorder_imports = true
reorder_modules = true
merge_derives = true
use_field_init_shorthand = false
use_try_shorthand = false
